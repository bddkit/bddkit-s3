services:
  # Garage rather than MinIO, whose images are no longer published (#9).
  # `--single-node` assigns the layout and `--default-bucket` creates the key
  # and the suite's bucket before the S3 API starts listening, so there is no
  # init container: once the healthcheck passes, the bucket is there. The
  # plugin has no step that creates a bucket — a bucket belongs to a config
  # entry — which is why the stand has to. Garage rejects an access key under
  # 8 characters and a secret under 16, hence the longer credentials.
  garage:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: bddkit-access
      GARAGE_DEFAULT_SECRET_KEY: bddkit-secret-key
      GARAGE_DEFAULT_BUCKET: apibdd-it
    configs:
      - source: garage
        target: /etc/garage.toml
    ports:
      - "9000:3900"
    healthcheck:
      test: ["CMD", "/garage", "health"]
      interval: 2s
      timeout: 3s
      retries: 20

configs:
  # s3_region is checked against the signature's region; us-east-1 is the
  # plugin's default. The rpc_secret only guards a cluster of one, in CI.
  garage:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      rpc_secret = "4f6b1c8e2d9a3b7f0e5c1a8d6b2f9e3c7a0d4b8f1e6c2a9d5b3f7e0c4a8d1b6f"

      [s3_api]
      s3_region = "us-east-1"
      api_bind_addr = "[::]:3900"
