[package]
name = "bddkit-s3"
version = "0.4.1"
edition = "2024"
rust-version = "1.97"
description = "S3-compatible object storage steps for the bddkit acceptance-testing tool"
license = "Apache-2.0"
repository = "https://github.com/bddkit/bddkit-s3"
homepage = "https://github.com/bddkit/bddkit-s3"
readme = "README.md"
keywords = ["bdd", "gherkin", "testing", "s3", "bddkit"]
categories = ["development-tools::testing"]
exclude = [
    "/.github",
    "/.idea",
    "/docker-compose.yml",
]

[lib]
crate-type = ["cdylib"]

[dependencies]
# `sync` (attohttpc + maybe-async) makes the API genuinely synchronous. NOT
# `blocking`, which wraps the async API in a tokio runtime: a cdylib is never
# unloaded and its Drop impls may never run, so a runtime living inside one has
# no owner. `dispatch` is synchronous by contract and the host already wraps it
# in spawn_blocking.
#
# default-features = false also disables `fail-on-err`, which is load-bearing:
# a 403 or a 404 must come back as a status code to inspect, not as an Err.
rust-s3 = { version = "0.37.2", default-features = false, features = ["sync", "sync-rustls-tls"] }
serde_json = "1.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
clone_on_ref_ptr = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
# noise for this project
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
format_push_string = "allow"
