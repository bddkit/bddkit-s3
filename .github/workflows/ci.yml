name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The host the plugin is tested against: a released bddkit, installed from
  # its tag and never from a floating branch, so a red run means this plugin
  # broke. Raise it when a newer release is out.
  HOST_TAG: v0.5.0
  # The bddkit-api release the e2e suite loads for its `api` resource.
  API_TAG: 0.1.0

jobs:
  test:
    name: test & clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # The toolchain is pinned on purpose: on a floating `stable` every new clippy
      # lint reddens PRs that have nothing to do with the change under review.
      # rustflags is emptied so only the clippy invocation below carries -D warnings.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
          rustflags: ""

      - name: Format check
        run: cargo fmt --check

      - name: File size budget
        run: |
          files=$(git ls-files '*.rs' '*.feature' '*.yaml' '*.yml' ':!.github/')
          status=0
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 1000 ]; then
              echo "::error file=$file::$lines lines, the limit is 1000"
              status=1
            fi
          done <<< "$files"
          exit "$status"

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked

  # The host is installed from HOST_TAG, never from a floating branch: a red
  # run here must mean this plugin broke, not that the host moved under it.
  # Bump the tag deliberately, as its own commit, so a failure after the bump
  # is attributable.
  e2e:
    name: e2e against Garage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          rustflags: ""

      - name: Cache the host
        id: host
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bddkit-host
          key: bddkit-host-${{ env.HOST_TAG }}-${{ runner.os }}
      - name: Install bddkit
        if: steps.host.outputs.cache-hit != 'true'
        shell: bash
        run: >-
          cargo install --git https://github.com/bddkit/bddkit --tag "$HOST_TAG"
          --locked --root "$RUNNER_TEMP/bddkit-host" bddkit
      - name: Use the host
        shell: bash
        run: |
          echo "$RUNNER_TEMP/bddkit-host/bin" >> "$GITHUB_PATH"
          exe=; [ "$RUNNER_OS" = Windows ] && exe=.exe
          echo "BDDKIT_BIN=$RUNNER_TEMP/bddkit-host/bin/bddkit$exe" >> "$GITHUB_ENV"

      # The suite's configs declare an `api` resource, served by the bddkit-api
      # plugin since 0.5.0: install it the way a user would and hand the tests
      # its library.
      - name: Install the api plugin
        shell: bash
        run: |
          dir="$RUNNER_TEMP/api-plugin"
          mkdir -p "$dir"
          "$BDDKIT_BIN" plugin install "bddkit/bddkit-api@$API_TAG" --bddkit-dir "$dir"
          echo "BDDKIT_API_PLUGIN=$dir/plugins/bddkit-api/$API_TAG/libbddkit_api.so" >> "$GITHUB_ENV"

      # --wait returns once the healthcheck passes, and Garage creates the
      # bucket before it starts serving, so the bucket exists by then.
      - name: Start Garage
        run: docker compose up --wait garage

      - name: End-to-end tests
        run: cargo test --locked --test e2e

      # The unit job above runs these too, but with nothing to reach: the three
      # live probe cases skip themselves there, and skipping is how they report
      # it. This is the only place a server exists, so this is the only place
      # the probe's 2xx, 403 and 404 branches — the three messages the feature
      # exists to produce — are actually executed. Same credentials as
      # docker-compose.yml.
      - name: Probe against Garage
        env:
          BDDKIT_S3_ENDPOINT: http://localhost:9000
          BDDKIT_S3_BUCKET: apibdd-it
          BDDKIT_S3_ACCESS_KEY: bddkit-access
          BDDKIT_S3_SECRET_KEY: bddkit-secret-key
        run: cargo test --locked --lib probe
